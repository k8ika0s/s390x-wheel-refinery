# Runtime definitions (CPython interpreters)
runtimes:
  cpython3.10:
    name: cpython3.10
    version: "3.10.13"
    python_version: "3.10"
    description: "CPython 3.10 interpreter"
    recipe: "cpython310.sh"
    dependencies:
      - openssl
      - libffi
      - zlib
      - xz
      - bzip2
      - sqlite
      
  cpython3.11:
    name: cpython3.11
    version: "3.11.7"
    python_version: "3.11"
    description: "CPython 3.11 interpreter"
    recipe: "cpython311.sh"
    dependencies:
      - openssl
      - libffi
      - zlib
      - xz
      - bzip2
      - sqlite
      
  cpython3.12:
    name: cpython3.12
    version: "3.12.1"
    python_version: "3.12"
    description: "CPython 3.12 interpreter"
    recipe: "cpython312.sh"
    dependencies:
      - openssl
      - libffi
      - zlib
      - xz
      - bzip2
      - sqlite

# Selection rules for automatic pack attachment
rules:
  - name: "cryptography-packages"
    description: "Packages requiring OpenSSL"
    package_patterns:
      - "cryptography"
      - "pyopenssl"
      - "paramiko"
      - "twisted"
    packs:
      - openssl
      - libffi
      
  - name: "imaging-packages"
    description: "Packages requiring image libraries"
    package_patterns:
      - "pillow"
      - "pil"
      - "imageio"
    packs:
      - jpeg
      - libpng
      - freetype
      - zlib
      
  - name: "xml-packages"
    description: "Packages requiring XML libraries"
    package_patterns:
      - "lxml"
      - "libxml"
      - "libxslt"
    packs:
      - libxml2
      - libxslt
      - zlib
      
  - name: "numpy-scipy"
    description: "Scientific computing packages"
    package_patterns:
      - "numpy"
      - "scipy"
      - "pandas"
    packs:
      - openblas
      - zlib
      
  - name: "compression-packages"
    description: "Packages requiring compression libraries"
    package_patterns:
      - "zstandard"
      - "python-zstandard"
      - "brotli"
    packs:
      - zstd
      - zlib
      - bzip2
      - xz

