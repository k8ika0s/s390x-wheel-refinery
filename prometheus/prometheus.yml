global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'refinery'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Control-plane API metrics
  - job_name: 'refinery-control-plane'
    static_configs:
      - targets: ['go-control-plane:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Worker metrics
  - job_name: 'refinery-worker'
    static_configs:
      - targets: ['go-worker:8081']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Postgres exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # MinIO metrics
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ['minio:9000']

  # Zot registry metrics
  - job_name: 'zot'
    static_configs:
      - targets: ['zot:5000']
    metrics_path: '/metrics'

# Made with Bob
